<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  :root{
    --ink:#0d1035; --muted:#4b5283; --violet:#7c5cf6; --cyan:#22c3e6;
    --grad:linear-gradient(90deg,#8b5cf6,#6d7bf7,#22d3ee);
    --card:rgba(255,255,255,.86); --line:#e3dcfb;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1350px;overflow:hidden}
  body{font-family:'Cairo',sans-serif;color:var(--ink);background:#f6f5fe;position:relative}
  .bg{position:absolute;inset:0;
    background-image:linear-gradient(rgba(124,92,246,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(124,92,246,.06) 1px,transparent 1px);
    background-size:72px 72px}
  .orb1{position:absolute;width:820px;height:820px;right:-260px;top:-300px;border-radius:50%;
    background:radial-gradient(circle,rgba(167,139,250,.42),rgba(167,139,250,0) 68%)}
  .orb2{position:absolute;width:760px;height:760px;left:-280px;bottom:-320px;border-radius:50%;
    background:radial-gradient(circle,rgba(34,211,238,.32),rgba(34,211,238,0) 68%)}
  .frame{position:absolute;inset:0;padding:56px 80px 0;display:flex;flex-direction:column}
  bdi,.lt{unicode-bidi:isolate;white-space:nowrap}
  .hl{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hl.rev{background:linear-gradient(90deg,#22d3ee,#6d7bf7,#8b5cf6);-webkit-background-clip:text;background-clip:text}

  .logo{text-align:center;direction:ltr}
  .logo .w{font-family:'JetBrains Mono';font-weight:800;font-size:54px;letter-spacing:3px;line-height:1;
    background:linear-gradient(90deg,#7c5cf6,#6d7bf7,#4f8ef7);-webkit-background-clip:text;color:transparent}
  .logo .s{font-family:'JetBrains Mono';font-weight:700;font-size:17px;letter-spacing:12px;margin-top:10px;color:var(--ink);padding-left:12px}

  .toprow{display:flex;justify-content:space-between;align-items:center;margin-top:34px}
  .chip{display:inline-block;line-height:1.5;padding:6px 22px;border-radius:999px;font-weight:800;font-size:26px}
  .c-v{background:#ede8fe;color:#6d3fe6}
  .c-c{background:#d8f6fc;color:#0b7f99}
  .c-p{background:#fde4f1;color:#c0267a}
  .c-g{background:#d9f7e8;color:#12804f}
  .c-a{background:#fdf0cf;color:#a35f00}
  .counter{font-family:'JetBrains Mono';font-weight:700;font-size:26px}
  .tagm{font-family:'JetBrains Mono';font-weight:700;font-size:25px;letter-spacing:1px}

  h1.big{font-weight:900;font-size:96px;line-height:1.18;margin-top:44px}
  h1.big.md{font-size:84px}
  .sub{font-weight:600;font-size:36px;color:var(--muted);margin-top:14px;line-height:1.5}
  h2{font-weight:900;font-size:62px;line-height:1.2;margin-top:24px}
  h2+.sub{font-size:31px;margin-top:4px}

  .card{background:var(--card);border:2px solid var(--line);border-radius:30px;
    box-shadow:0 20px 50px -24px rgba(91,70,200,.25)}
  .check{margin-top:auto;margin-bottom:150px;padding:36px 44px}
  .check .q{font-weight:800;font-size:38px;color:#6d3fe6;margin-bottom:18px}
  .check .it{display:flex;align-items:center;gap:22px;font-weight:800;font-size:46px;margin-top:14px}
  .tick{flex:0 0 60px;height:60px;border-radius:50%;background:#34d399;display:flex;align-items:center;justify-content:center}

  .list{display:flex;flex-direction:column;gap:24px;margin-top:32px}
  .item{padding:26px 34px}
  .ihead{display:flex;align-items:center;gap:22px}
  .num{flex:0 0 64px;height:64px;border-radius:18px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono';font-weight:800;font-size:32px}
  .it-t{font-weight:900;font-size:44px;line-height:1.25}
  .row{display:flex;align-items:center;gap:16px;margin-top:14px;font-weight:700;font-size:31px;line-height:1.4;color:#1e2250}
  .row .chip{font-size:24px;padding:3px 18px;flex:0 0 auto}
  .compact .item{padding:24px 32px}
  .compact .it-t{font-size:38px}
  .compact .row{font-size:29px;margin-top:8px}
  .compact .num{flex-basis:56px;height:56px;font-size:28px;border-radius:16px}

  .flow{display:flex;flex-direction:column;align-items:stretch;margin-top:28px}
  .node{display:flex;align-items:center;gap:24px;padding:20px 30px}
  .node.key{border:3px solid transparent;background:linear-gradient(#fff,#fff) padding-box,var(--grad) border-box}
  .node .ic{flex:0 0 60px;height:60px;border-radius:50%;background:#ede8fe;color:#6d3fe6;display:flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono';font-weight:800;font-size:28px}
  .node.key .ic{background:var(--grad);color:#fff}
  .node .nt{font-weight:900;font-size:36px;line-height:1.25}
  .node .nd{font-weight:700;font-size:28px;color:var(--muted);margin-top:2px;line-height:1.4}
  .node .chip{margin-inline-start:auto;font-size:22px;padding:3px 16px;font-family:'JetBrains Mono';font-weight:700;direction:ltr}
  .arrow{height:40px;display:flex;justify-content:center}

  .term{margin-top:30px;background:#0f1330;border-radius:30px;padding:0 0 30px;box-shadow:0 30px 60px -30px rgba(30,20,90,.55);overflow:hidden}
  .term .bar{display:flex;align-items:center;gap:12px;padding:20px 30px;background:#171c42;direction:ltr}
  .dot{width:16px;height:16px;border-radius:50%}
  .term .fn{font-family:'JetBrains Mono';font-weight:700;font-size:22px;color:#93a0c7;margin-left:14px}
  .term .ln{color:#eef2ff;font-weight:700;font-size:33px;line-height:1.6;padding:0 44px}
  .term .bar{margin-bottom:24px}
  .term .ln.dim{color:#93a0c7}
  .term .ln.gap{height:14px}
  .ph{font-family:'JetBrains Mono';color:#67e8f9;font-weight:700;font-size:27px}
  .term .ln .k{color:#c4b5fd}
  .note{margin-top:22px;padding:18px 28px;font-weight:700;font-size:28px;display:flex;gap:16px;align-items:center}

  .ctawrap{display:flex;flex-direction:column;align-items:center;text-align:center}
  .ctawrap h2{font-size:76px;margin-top:40px}
  .ctawrap .sub{font-size:34px}
  .cl{width:100%;margin-top:30px;display:flex;flex-direction:column;gap:18px}
  .cl .card{display:flex;align-items:center;justify-content:space-between;padding:26px 36px;font-weight:800;font-size:36px}
  .cl .n{flex:0 0 72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono';font-weight:800;font-size:28px}
  .btn{margin-top:38px;padding:22px 76px;border-radius:999px;background:var(--grad);color:#fff;font-weight:900;font-size:52px;
    box-shadow:0 24px 50px -18px rgba(109,123,247,.7)}
  .follow{margin-top:20px;font-size:30px}

  .foot{position:absolute;left:80px;right:80px;bottom:62px;display:flex;justify-content:space-between;align-items:center}
  .foot .sw{font-weight:800;font-size:32px;color:#6d3fe6}
  .dots{display:flex;gap:10px;align-items:center;direction:ltr}
  .dots i{width:14px;height:14px;border-radius:50%;background:#e2dcf7;display:block}
  .dots i.on{width:44px;border-radius:8px;background:var(--grad)}
</style>
</head>
<body>
<div class="bg"></div><div class="orb1"></div><div class="orb2"></div>
<div class="frame" id="f"></div>
<div class="foot" id="foot"></div>
<script>
const LATIN=/[A-Za-z0-9@#{][A-Za-z0-9@#_.\-+/'%{}():÷×=]*(?: [A-Za-z0-9@#{(×+=÷/\-][A-Za-z0-9@#_.\-+/'%{}():÷×=]*)*/g;
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function lat(s){return esc(s.replace(/ـ /g,'ـ\u00a0')).replace(LATIN,m=>{const t=m.match(/[.:،]+$/);const c=t?m.slice(0,-t[0].length):m;return `<bdi>${c}</bdi>`+(t?t[0]:'')})}
// *x* = gradient highlight, [x] = placeholder (mono cyan)
function T(s){
  if(s==null) return '';
  return String(s).split(/(\*[^*]+\*|\[[^\]]+\])/).map(p=>{
    if(/^\*.*\*$/.test(p)) return `<span class="hl">${lat(p.slice(1,-1))}</span>`;
    if(/^\[.*\]$/.test(p)) return `<span class="ph"><bdi>${esc(p)}</bdi></span>`;
    return lat(p);
  }).join('');
}
const TICK='<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const ARROW='<svg width="40" height="40" viewBox="0 0 40 40"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><path d="M20 3v28" stroke="url(#ag)" stroke-width="4" stroke-linecap="round"/><path d="M11 23l9 10 9-10" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const CC={v:'c-v',c:'c-c',p:'c-p',g:'c-g',a:'c-a'};
const logo='<div class="logo"><div class="w">IXEAM</div><div class="s">AI LABS</div></div>';
function topRow(s){
  if(!s.counter&&!s.tag) return '';
  return `<div class="toprow"><span class="chip ${CC[s.tagColor||'v']} tagm">${T(s.tag||'')}</span><span class="chip c-c counter"><bdi>${s.counter||''}</bdi></span></div>`;
}
function render(s,idx,total){
  const f=document.getElementById('f'); let h=logo;
  if(s.type==='hook'){
    h+=`<div class="toprow"><span class="chip c-v">${T(s.badge)}</span><span></span></div>
        <h1 class="big ${s.size||''}">${T(s.title)}</h1><div class="sub">${T(s.sub)}</div>
        <div class="card check"><div class="q">شنو غادي تاخد من هاد البوست؟</div>
        ${s.items.map(i=>`<div class="it"><span class="tick">${TICK}</span><span>${T(i)}</span></div>`).join('')}</div>`;
  } else if(s.type==='cards'){
    h+=topRow(s)+`<h2>${T(s.title)}</h2>${s.sub?`<div class="sub">${T(s.sub)}</div>`:''}
      <div class="list ${s.compact?'compact':''}">${s.items.map((it,k)=>`<div class="card item">
        <div class="ihead">${it.num===false?'':`<span class="num">${it.n||k+1}</span>`}<span class="it-t">${T(it.t)}</span></div>
        ${(it.rows||[]).map(r=>`<div class="row"><span class="chip ${CC[r[0]]}">${T(r[1])}</span><span>${T(r[2])}</span></div>`).join('')}
      </div>`).join('')}</div>`;
    if(s.note) h+=`<div class="card note"><span class="chip ${CC[s.note[0]]}">${T(s.note[1])}</span><span>${T(s.note[2])}</span></div>`;
  } else if(s.type==='flow'){
    h+=topRow(s)+`<h2>${T(s.title)}</h2>${s.sub?`<div class="sub">${T(s.sub)}</div>`:''}<div class="flow">`+
      s.nodes.map((n,k)=>`${k?`<div class="arrow">${ARROW}</div>`:''}<div class="card node ${n.key?'key':''}">
        <span class="ic">${k+1}</span><div><div class="nt">${T(n.t)}</div>${n.d?`<div class="nd">${T(n.d)}</div>`:''}</div>
        ${n.chip?`<span class="chip c-c">${esc(n.chip)}</span>`:''}</div>`).join('')+`</div>`;
    if(s.note) h+=`<div class="card note"><span class="chip ${CC[s.note[0]]}">${T(s.note[1])}</span><span>${T(s.note[2])}</span></div>`;
  } else if(s.type==='prompt'){
    h+=topRow(s)+`<h2>${T(s.title)}</h2>${s.sub?`<div class="sub">${T(s.sub)}</div>`:''}
      <div class="term"><div class="bar"><span class="dot" style="background:#f472b6"></span><span class="dot" style="background:#fbbf24"></span><span class="dot" style="background:#34d399"></span><span class="fn">${esc(s.file||'prompt.txt')}</span></div>
      ${s.lines.map(l=>l===''?'<div class="ln gap"></div>':`<div class="ln ${l.startsWith('~')?'dim':''}">${T(l.replace(/^~/,''))}</div>`).join('')}</div>`;
    if(s.note) h+=`<div class="card note"><span class="chip ${CC[s.note[0]]}">${T(s.note[1])}</span><span>${T(s.note[2])}</span></div>`;
  } else if(s.type==='cta'){
    const cols=['c-v','c-c','c-p'];
    h+=`<div class="ctawrap"><h2>${T(s.title)}</h2><div class="sub">${T(s.sub||'ابعثلنا ميساج ونبداو')}</div>
      <div class="cl">${s.items.map((it,k)=>`<div class="card"><span>${T(it)}</span><span class="n ${cols[k%3]}">0${k+1}</span></div>`).join('')}</div>
      <div class="btn">ابعثلنا ميساج</div>
      <div class="chip c-v follow">تابع <bdi>@ixeam_01</bdi> باش تتعلم أكثر</div></div>`;
  }
  f.innerHTML=h;
  const last=idx===total-1;
  document.getElementById('foot').innerHTML=
    `<span class="sw">${last?'سجّل البوست باش ما تضيعوش':'اسحب ←'}</span>
     <span class="dots">${Array.from({length:total},(_,k)=>`<i class="${k===idx?'on':''}"></i>`).join('')}</span>`;
}
window.render=render;
</script>
</body>
</html>
